name: 'Checkout Code with Submodules'
description: 'Checks out the repository code, including submodules.'
inputs:
  submodules:
    description: 'Whether to checkout submodules (e.g., recursive)'
    required: false
    default: 'recursive'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: ${{ inputs.submodules }}
