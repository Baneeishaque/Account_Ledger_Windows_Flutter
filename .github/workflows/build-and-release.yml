name: Build and Release Flutter App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # Skip push events for automated tool branches (they're always associated with PRs)
    if: github.event_name != 'push' || (!startsWith(github.ref, 'refs/heads/copilot/') && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.ref, 'refs/heads/coderabbitai/'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Linux build dependencies
        run: |
          chmod +x ./.github/scripts/install-linux-deps.bash
          ./.github/scripts/install-linux-deps.bash

      - uses: ./.github/actions/install-jq

      - uses: ./.github/actions/setup-mise

      - uses: ./.github/actions/clone-env
        with:
          configuration_repo: ${{ secrets.CONFIGURATION_REPO }}
          configuration_repo_access_token: ${{ secrets.CONFIGURATION_REPO_ACCESS_TOKEN }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - uses: ./.github/actions/kotlin-native-build
        with:
          platform_command: ./gradlew linkDebugSharedLinuxX64

      - uses: ./.github/actions/flutter-setup

      - uses: ./.github/actions/flutter-app-build
        with:
          platform_command: flutter build linux --release

      - uses: ./.github/actions/upload-artifact
        with:
          artifact_name: linux-build
          artifact_path: build/linux/x64/release/bundle

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # Skip push events for automated tool branches (they're always associated with PRs)
    if: github.event_name != 'push' || (!startsWith(github.ref, 'refs/heads/copilot/') && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.ref, 'refs/heads/coderabbitai/'))
    env:
      MISE_DISABLE_BACKENDS: vfox
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Verify Visual Studio Environment
        shell: powershell
        run: ./.github/scripts/verify-vs-workload.ps1

      # - uses: ./.github/actions/install-jq

      - name: Workaround - Temporarily remove Flutter from mise.toml (Windows only)
        shell: powershell
        run: |
          # Read mise.toml and extract Flutter version
          $content = Get-Content mise.toml -Raw
          if ($content -match 'flutter\s*=\s*"([^"]+)"') {
            $flutterVersion = $matches[1]
            Write-Output "FLUTTER_VERSION=$flutterVersion" >> $env:GITHUB_ENV
            Write-Host "Extracted Flutter version: $flutterVersion"
          }
          # Remove Flutter line from mise.toml for mise install
          (Get-Content mise.toml) | Where-Object { $_ -notmatch '^flutter\s*=' } | Set-Content mise.toml.tmp
          Move-Item -Force mise.toml.tmp mise.toml
          Write-Host "Temporarily removed Flutter from mise.toml"
          Get-Content mise.toml

      - uses: ./.github/actions/setup-mise

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4

      - name: Install vfox CLI via Scoop
        run: scoop install vfox

      - name: Install Flutter with vfox
        shell: powershell
        run: ./.github/scripts/install-flutter-vfox.ps1

      - uses: ./.github/actions/clone-env
        with:
          configuration_repo: ${{ secrets.CONFIGURATION_REPO }}
          configuration_repo_access_token: ${{ secrets.CONFIGURATION_REPO_ACCESS_TOKEN }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - uses: ./.github/actions/kotlin-native-build
        with:
          platform_command: ./gradlew.bat linkDebugSharedMingwX64

      - uses: ./.github/actions/flutter-setup

      - uses: ./.github/actions/flutter-app-build
        with:
          platform_command: flutter build windows --release

      - uses: ./.github/actions/upload-artifact
        with:
          artifact_name: windows-build
          artifact_path: build/windows/runner/Release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: ./.github/actions/install-jq

      - uses: ./.github/actions/setup-mise

      - uses: ./.github/actions/clone-env
        with:
          configuration_repo: ${{ secrets.CONFIGURATION_REPO }}
          configuration_repo_access_token: ${{ secrets.CONFIGURATION_REPO_ACCESS_TOKEN }}

      - uses: ./.github/actions/kotlin-native-build
        with:
          platform_command: ./gradlew linkReleaseSharedMacosArm64

      - uses: ./.github/actions/flutter-setup

      - uses: ./.github/actions/flutter-app-build
        with:
          platform_command: flutter build macos --release

      - uses: ./.github/actions/upload-artifact
        with:
          artifact_name: macos-build
          artifact_path: build/macos/Build/Products/Release
