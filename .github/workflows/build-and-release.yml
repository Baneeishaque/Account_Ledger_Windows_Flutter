name: Build and Release Flutter App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Linux build dependencies
        run: |
          chmod +x ./.github/scripts/install-linux-deps.bash
          ./.github/scripts/install-linux-deps.bash

      - name: Install jq
        uses: dcarbone/install-jq-action@v2.1.0

      - name: Setup mise tool versions
        uses: jdx/mise-action@v2

      - name: Build Kotlin/Native Library for Linux
        working-directory: ./account_ledger_lib_kotlin_native
        run: ./gradlew linkDebugSharedLinuxX64

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate environment variables
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Linux application
        run: flutter build linux --release

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      MISE_DISABLE_BACKENDS: vfox
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Verify Visual Studio Environment
        shell: powershell
        run: ./.github/scripts/verify-vs-workload.ps1

      - name: Install jq
        uses: dcarbone/install-jq-action@v2.1.0

      - name: Setup Java with mise
        uses: jdx/mise-action@v2

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4

      - name: Install vfox CLI via Scoop
        run: scoop install vfox

      - name: Install Flutter with vfox
        shell: powershell
        run: ./.github/scripts/install-flutter-vfox.ps1

      - name: Build Kotlin/Native Library for Windows
        working-directory: ./account_ledger_lib_kotlin_native
        run: ./gradlew.bat linkDebugSharedMingwX64

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate environment variables
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows application
        run: flutter build windows --release

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/runner/Release
